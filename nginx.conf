server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 1) Servir directamente los archivos estáticos (JS, CSS, imágenes, fuentes...) si existen
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf|json)$ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 2) Para todo lo demás (rutas de SPA), fallback a index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Opcional: página de error / fallback
  error_page 404 /index.html;
}
